<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS lampada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h1>Q que o JavaScript pode fazer?</h1>
                <p>JavaScript pode alterar valores de atributos HTML.</p>
                <img src="imagens/acesa.jpg" alt="lampada_Acesa" id="myimage">

                <Button class="btn btn-secondary" onclick="document.getElementById('myimage').src='imagens/apagada.jpg'">Apague a Lampada</Button>
                <Button class="btn btn-secondary" onclick="document.getElementById('myimage').src='imagens/acesa.jpg'">Acenda a Lampada</Button>
                <Button class="btn btn-secondary" onclick="document.getElementById('myimage').src='imagens/quebrada.jpg'">quebre a Lampada</Button>
            </div>
        </div>
    </div>
</body>
</html>
