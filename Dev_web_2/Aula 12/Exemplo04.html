<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-4">
                <img src="imagens/03contasMes.jpg" alt="contas do mês" class="img-fluid">
            </div>
            <div class="col-8">
                <h1>Programa contas do mês</h1>
                <form action="">
                    <p>Descrição da Conta:
                        <input type="text" id="inDescricao" required>
                    </p>
                    <p>Valor a pagar:
                        <input type="number" id="inValor" min="0" step="0.10" required>
                    </p>
                    <input type="submit" value="Registrar conta" class="btn-success">
                </form>
                <p>&nbsp;</p>
                <pre id="outResp1"></pre>
                <pre id="outResp2"></pre>
            </div>
        </div>
    </div>
    <script src="js/ex04.js"></script>
</body>
</html>
