<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Situação do aluno</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h1>Programa situação do aluno</h1>
                <p>Nome do Aluno:
                    <form action="">
                    <input type="text" id="inNome" required>
                    </form>
                </p>
                <form action="">
                    <p>1° nota:
                        <input type="number" id="inNota1" min="0" max="10" step="0.1">
                    </p>
                    <p>2° nota:
                        <input type="number" id="inNota2" min="0" max="10" step="0.1">
                    </p>
                    <input type="submit" class="btn btn-success" value="Exibir media e situação">
                </form>
                <h3></h3>
                <h4></h4>
            </div>
        </div>
    </div>
    <script src="js/ex01.js"></script>
</body>
</html>
