<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Programa Parquímetro</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-3">
                <img src="imagens/exerc.jpg" alt="Parquímetro" class="img-fluid">
            </div>

            <div class="col-9">
                <h1>Programa Parquímetro</h1>

                <form action="">
                    <p>Valor R$:
                        <input type="number" id="inValor" min="0" step="0.01" required>
                        <input type="submit" value="Confirmar Depósito" class="btn btn-success">
                    </p>
                </form>

                <h3 id="outTempo"></h3>
                <h3 id="outTroco"></h3>
            </div>
        </div>
    </div>

    <script src="js/ex03.js"></script>
</body>
</html>
