<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Programa Verifica Velocidade</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-3">
                <img src="imagens/exerc.jpg" alt="Verifica Velocidade" class="img-fluid">
            </div>
            <div class="col-9">
                <h1>Programa Verifica Velocidade</h1>
                <form action="">
                    <p>Velocidade Permitida:
                        <input type="number" id="inPermitida" required>
                    </p>
                    <p>Velocidade do Condutor:
                        <input type="number" id="inCondutor" required>
                    </p>
                    <input type="submit" value="Verificar Velocidade" class="btn btn-success">
                </form>
                <h3 id="outResp"></h3>
            </div>
        </div>
    </div>
    <script src="js/ex02.js"></script>
</body>
</html>
